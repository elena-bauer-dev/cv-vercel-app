<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Elena Bauer | Frontend Developer</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f7fa;
        color: #25232b;
        min-height: 100vh;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .card {
        background: #ffffff;
        border-radius: 24px;
        padding: 70px;
        border: 1px solid #e9e4ed;
        box-shadow: 0 20px 60px rgba(35, 20, 50, 0.05);
      }

      .label {
        color: #ad66d5;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      h1 {
        font-size: clamp(40px, 7vw, 72px);
        line-height: 1.1;
        letter-spacing: -3px;
        margin-bottom: 20px;
      }

      h1 span {
        color: #ad66d5;
      }

      .profession {
        font-size: 24px;
        color: #686471;
        margin-bottom: 28px;
      }

      .description {
        max-width: 600px;
        font-size: 17px;
        line-height: 1.8;
        color: #77737f;
        margin-bottom: 40px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 26px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: 0.3s ease;
      }

      .btn-primary {
        background: #ad66d5;
        color: white;
      }

      .btn-primary:hover {
        background: #9250bb;
        transform: translateY(-2px);
      }

      .btn-secondary {
        border: 1px solid #ded5e8;
        color: #393441;
        background: white;
      }

      .btn-secondary:hover {
        border-color: #ad66d5;
        color: #ad66d5;
        transform: translateY(-2px);
      }

      footer {
        margin-top: 30px;
        text-align: center;
        color: #9994a0;
        font-size: 13px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 32px 16px;
        }

        .card {
          padding: 36px 24px;
          border-radius: 18px;
        }

        h1 {
          letter-spacing: -2px;
        }

        .profession {
          font-size: 20px;
        }

        .buttons {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <p class="label">Portfolio / Resume</p>

        <h1>Elena <span>Bauer</span></h1>

        <h2 class="profession">Frontend Developer</h2>

        <p class="description">
          I create modern, responsive and user-friendly web interfaces. Explore
          my resume and learn more about my skills and experience.
        </p>

        <div class="buttons">
          <a
            class="btn btn-primary"
            href="/ELENA_BAUER_CV_Frontend_Developer_De.pdf"
            target="_blank"
            rel="noopener noreferrer"
          >
            View CV ↗
          </a>

          <a
            class="btn btn-secondary"
            href="/ELENA_BAUER_CV_Frontend_Developer_De.pdf"
            download
          >
            Download CV ↓
          </a>
        </div>
      </section>

      <footer>© 2026 Elena Bauer · Frontend Developer</footer>
    </main>
  </body>
</html>
